<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied - IT Software Complain System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="text-center px-4">
        <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-3">Access Denied</h1>
        <p class="text-gray-500 mb-8 max-w-md mx-auto">
            You do not have permission to access this page. Please contact your administrator if you believe this is an error.
        </p>
        <div class="flex items-center justify-center space-x-4">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                <i class="fas fa-home mr-2"></i>Go to Dashboard
            </a>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('complaints.list_complaints') }}" class="btn btn-secondary">
                <i class="fas fa-list mr-2"></i>My Complaints
            </a>
            {% else %}
            <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">
                <i class="fas fa-sign-in-alt mr-2"></i>Login
            </a>
            {% endif %}
        </div>
        <p class="text-sm text-gray-400 mt-8">
            Need access? Request it from your department administrator.
        </p>
    </div>
</body>
</html>

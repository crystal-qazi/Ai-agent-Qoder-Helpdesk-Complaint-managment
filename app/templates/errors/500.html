<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error - IT Software Complain System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="text-center px-4">
        <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="text-5xl font-bold text-red-600">500</span>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-3">Internal Server Error</h1>
        <p class="text-gray-500 mb-8 max-w-md mx-auto">
            Something went wrong on our end. Our team has been notified and is working to resolve the issue.
        </p>
        <div class="flex items-center justify-center space-x-4">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                <i class="fas fa-home mr-2"></i>Go to Dashboard
            </a>
            <button onclick="window.location.reload()" class="btn btn-secondary">
                <i class="fas fa-redo mr-2"></i>Try Again
            </button>
        </div>
        <p class="text-sm text-gray-400 mt-8">
            If this problem persists, please contact IT Support with the error details.
        </p>
    </div>
</body>
</html>

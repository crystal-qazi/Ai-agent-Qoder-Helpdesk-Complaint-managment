{% extends 'layouts/base.html' %}

{% block title %}Change Password{% endblock %}

{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <form method="POST" action="" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div>
            <label for="current_password" class="block text-sm font-medium text-gray-700 mb-1">Current Password <span class="text-red-500">*</span></label>
            <input type="password" name="current_password" id="current_password" autocomplete="current-password" required class="form-input">
        </div>
        
        <div>
            <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">New Password <span class="text-red-500">*</span></label>
            <input type="password" name="new_password" id="new_password" autocomplete="new-password" required class="form-input">
            <p class="mt-1 text-sm text-gray-500">Must be at least 8 characters with uppercase, lowercase, number, and special character</p>
        </div>
        
        <div>
            <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password <span class="text-red-500">*</span></label>
            <input type="password" name="confirm_password" id="confirm_password" autocomplete="new-password" required class="form-input">
        </div>
        
        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Change Password</button>
        </div>
    </form>
</div>
{% endblock %}

{% extends "layouts/base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h1 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Forgot Password</h1>
            <p class="mt-2 text-center text-sm text-gray-600">Enter your email address and we'll send you a link to reset your password.</p>
        </div>
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <form class="space-y-6" method="POST" action="{{ url_for('auth.forgot_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                               class="form-input">
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full btn btn-primary">
                        <i class="fas fa-paper-plane mr-2"></i>Send Reset Link
                    </button>
                </div>

                <div class="text-center">
                    <a href="{{ url_for('auth.login') }}" class="text-sm text-primary-600 hover:text-primary-500">
                        Back to login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
